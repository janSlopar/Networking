<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kviz – Računalne mreže</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f0f2f8;
    --surface: #ffffff;
    --card: #ffffff;
    --border: #c8cde0;
    --accent: #3a28c8;
    --accent2: #007a50;
    --wrong: #c8001e;
    --text: #0d0e1a;
    --muted: #505268;
    --mono: 'Space Mono', monospace;
    --sans: 'Syne', sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 60px;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(58,40,200,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(58,40,200,0.05) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }
  .wrap { position: relative; z-index: 1; width: 100%; max-width: 720px; }
  header { text-align: center; margin-bottom: 40px; padding-top: 20px; }
  .logo { font-family: var(--mono); font-size: 11px; letter-spacing: 4px; color: var(--accent); text-transform: uppercase; margin-bottom: 12px; }
  header h1 { font-size: clamp(24px, 5vw, 40px); font-weight: 800; line-height: 1.1; background: linear-gradient(135deg, #0d0e1a 30%, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .progress-bar { height: 3px; background: var(--border); border-radius: 2px; margin-bottom: 12px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 2px; transition: width 0.4s cubic-bezier(.4,0,.2,1); }
  .progress-meta { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; color: var(--muted); margin-bottom: 28px; }
  .score-badge { color: var(--accent2); font-weight: 700; }
  .card { background: var(--card); border: 1px solid var(--border); box-shadow: 0 2px 12px rgba(0,0,0,0.07); border-radius: 16px; padding: 32px; margin-bottom: 20px; position: relative; overflow: hidden; animation: slideIn .35s cubic-bezier(.4,0,.2,1); }
  @keyframes slideIn { from { opacity:0; transform: translateY(16px); } to { opacity:1; transform: translateY(0); } }
  .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 2px 2px 0 0; }
  .q-number { font-family: var(--mono); font-size: 11px; color: var(--accent); letter-spacing: 2px; margin-bottom: 16px; }
  .q-text { font-size: 17px; font-weight: 600; line-height: 1.6; margin-bottom: 28px; white-space: pre-wrap; }
  .q-text .mono-block { font-family: var(--mono); font-size: 13px; color: var(--accent2); background: rgba(0,122,80,0.06); border: 1px solid rgba(0,122,80,0.20); border-radius: 8px; padding: 10px 14px; display: block; margin: 12px 0; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option { background: var(--surface); border: 1px solid var(--border); box-shadow: 0 2px 12px rgba(0,0,0,0.07); border-radius: 10px; padding: 14px 18px; cursor: pointer; display: flex; align-items: center; gap: 14px; transition: border-color .2s, background .2s, transform .15s; font-size: 15px; }
  .option:hover:not(.disabled) { border-color: var(--accent); background: rgba(58,40,200,0.07); transform: translateX(4px); }
  .option-letter { font-family: var(--mono); font-size: 11px; color: var(--muted); background: var(--border); border-radius: 5px; padding: 3px 7px; flex-shrink: 0; transition: background .2s, color .2s; }
  .option.correct { border-color: var(--accent2); background: rgba(0,122,80,0.08); }
  .option.correct .option-letter { background: var(--accent2); color: #000; }
  .option.wrong { border-color: var(--wrong); background: rgba(200,0,30,0.08); }
  .option.wrong .option-letter { background: var(--wrong); color: #fff; }
  .option.disabled { cursor: default; pointer-events: none; }
  .open-answer { display: flex; flex-direction: column; gap: 12px; }
  .open-answer input { background: var(--surface); border: 1px solid var(--border); box-shadow: 0 2px 12px rgba(0,0,0,0.07); border-radius: 10px; padding: 14px 18px; font-family: var(--mono); font-size: 15px; color: var(--text); outline: none; transition: border-color .2s; }
  .open-answer input:focus { border-color: var(--accent); }
  .open-answer input.correct { border-color: var(--accent2); background: rgba(0,122,80,0.08); }
  .open-answer input.wrong { border-color: var(--wrong); background: rgba(200,0,30,0.08); }
  .submit-btn { background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 14px 24px; font-family: var(--sans); font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity .2s, transform .15s; }
  .submit-btn:hover { opacity: .85; transform: translateY(-1px); }
  .submit-btn:disabled { opacity: .4; cursor: default; transform: none; }
  .feedback { margin-top: 16px; padding: 14px 18px; border-radius: 10px; font-size: 14px; font-weight: 600; display: none; align-items: center; gap: 10px; }
  .feedback.show { display: flex; animation: fadeIn .3s ease; }
  .feedback.ok { background: rgba(0,122,80,0.10); border: 1px solid rgba(0,122,80,0.35); color: var(--accent2); }
  .feedback.bad { background: rgba(200,0,30,0.08); border: 1px solid rgba(200,0,30,0.35); color: var(--wrong); }
  @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

  /* Nav buttons */
  .nav-btns { display: flex; gap: 10px; margin-bottom: 0; }
  .prev-btn { flex: 0 0 auto; background: transparent; border: 1px solid var(--border); box-shadow: 0 2px 12px rgba(0,0,0,0.07); color: var(--muted); border-radius: 10px; padding: 14px 20px; font-family: var(--sans); font-size: 15px; font-weight: 600; cursor: pointer; transition: border-color .2s, color .2s, transform .15s; display: none; }
  .prev-btn.show { display: block; animation: fadeIn .3s ease; }
  .prev-btn:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
  .next-btn { flex: 1; background: transparent; border: 1px solid var(--accent); color: var(--accent); border-radius: 10px; padding: 14px; font-family: var(--sans); font-size: 15px; font-weight: 600; cursor: pointer; letter-spacing: 1px; transition: background .2s, color .2s, transform .15s; display: none; }
  .next-btn.show { display: block; animation: fadeIn .3s ease; }
  .next-btn:hover { background: var(--accent); color: #fff; transform: translateY(-1px); }

  /* Results */
  .results { text-align: center; padding: 48px 32px 32px; display: none; }
  .results.show { display: block; animation: slideIn .4s ease; }
  .big-score { font-family: var(--mono); font-size: clamp(48px, 12vw, 80px); font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1; margin-bottom: 8px; }
  .final-msg { color: var(--muted); font-size: 16px; margin-bottom: 32px; }
  .results-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 32px; }
  .restart-btn { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border: none; border-radius: 12px; padding: 16px 40px; font-family: var(--sans); font-size: 16px; font-weight: 700; cursor: pointer; transition: opacity .2s, transform .15s; }
  .restart-btn:hover { opacity: .85; transform: translateY(-2px); }
  .review-toggle-btn { background: transparent; border: 1px solid var(--accent); color: var(--accent); border-radius: 12px; padding: 16px 32px; font-family: var(--sans); font-size: 16px; font-weight: 700; cursor: pointer; transition: background .2s, color .2s, transform .15s; }
  .review-toggle-btn:hover { background: var(--accent); color: #fff; transform: translateY(-2px); }

  /* Review */
  .review { display: none; text-align: left; }
  .review.show { display: block; }
  .review-title { font-family: var(--mono); font-size: 11px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; margin-bottom: 20px; }
  .review-item { background: var(--surface); border: 1px solid var(--border); box-shadow: 0 2px 12px rgba(0,0,0,0.07); border-left: 3px solid var(--border); border-radius: 12px; padding: 18px 20px; margin-bottom: 10px; }
  .review-item.ok { border-left-color: var(--accent2); }
  .review-item.bad { border-left-color: var(--wrong); }
  .review-status { font-size: 12px; font-weight: 700; margin-bottom: 8px; font-family: var(--mono); }
  .review-status.ok { color: var(--accent2); }
  .review-status.bad { color: var(--wrong); }
  .review-q { font-size: 14px; font-weight: 600; margin-bottom: 10px; line-height: 1.5; white-space: pre-wrap; }
  .review-q .mono-block { font-family: var(--mono); font-size: 11px; color: var(--accent2); background: rgba(0,122,80,0.06); border: 1px solid rgba(0,122,80,0.20); border-radius: 6px; padding: 5px 10px; display: block; margin: 5px 0; }
  .review-answers { font-family: var(--mono); font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
  .review-correct-ans { color: var(--accent2); }
  .review-wrong-ans { color: var(--wrong); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">TVZ · Računalne mreže</div>
    <h1>Kviz za kolokvij</h1>
  </header>

  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-meta">
    <span id="progressText">Pitanje 1 / 101</span>
    <span>Rezultat: <span class="score-badge" id="scoreText">0</span></span>
  </div>

  <div class="card" id="questionCard">
    <div class="q-number" id="qNumber">PITANJE 01</div>
    <div class="q-text" id="qText"></div>
    <div id="qBody"></div>
    <div class="feedback" id="feedback"></div>
  </div>

  <div class="nav-btns">
    <button class="prev-btn" id="prevBtn" onclick="prevQuestion()">← Prethodno</button>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Sljedeće pitanje →</button>
  </div>

  <div class="card results" id="results">
    <div class="big-score" id="finalScore"></div>
    <p class="final-msg" id="finalMsg"></p>
    <div class="results-btns">
      <button class="restart-btn" onclick="restart()">Ponovi kviz</button>
      <button class="review-toggle-btn" id="reviewToggleBtn" onclick="toggleReview()">Pregledaj odgovore</button>
    </div>
    <div class="review" id="reviewSection">
      <div class="review-title">Pregled svih pitanja</div>
      <div id="reviewList"></div>
    </div>
  </div>
</div>

function shuffle(arr) {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

let questions, current, score, history;

function init() {
  questions = shuffle(ALL_QUESTIONS);
  current = 0; score = 0; history = [];
  document.getElementById('results').classList.remove('show');
  document.getElementById('questionCard').style.display = 'block';
  document.getElementById('reviewSection').classList.remove('show');
  document.getElementById('reviewToggleBtn').textContent = 'Pregledaj odgovore';
  renderQuestion();
}

function qTextHtml(text) {
  const lines = text.split('\n');
  let html = '';
  lines.forEach((line,i) => {
    if(i===0) html += line;
    else if(line.match(/^[01]+\.[01]+/)) html += `<span class="mono-block">${line}</span>`;
    else html += '\n' + line;
  });
  return html;
}

function renderQuestion() {
  const q = questions[current];
  const total = questions.length;
  const saved = history[current];

  document.getElementById('progressFill').style.width = ((current/total)*100)+'%';
  document.getElementById('progressText').textContent = `Pitanje ${current+1} / ${total}`;
  document.getElementById('scoreText').textContent = score;
  document.getElementById('qNumber').textContent = `PITANJE ${String(current+1).padStart(2,'0')}`;

  // Prev button
  current > 0 ? document.getElementById('prevBtn').classList.add('show') : document.getElementById('prevBtn').classList.remove('show');

  // Next button
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.textContent = current === total-1 ? 'Završi kviz →' : 'Sljedeće pitanje →';
  saved ? nextBtn.classList.add('show') : nextBtn.classList.remove('show');

  // Animate card
  const card = document.getElementById('questionCard');
  card.style.animation = 'none'; card.offsetHeight; card.style.animation = '';

  document.getElementById('qText').innerHTML = qTextHtml(q.t);

  const feedback = document.getElementById('feedback');
  feedback.className = 'feedback';
  const body = document.getElementById('qBody');
  body.innerHTML = '';

  if(q.open) {
    const wrap = document.createElement('div');
    wrap.className = 'open-answer';
    const inp = document.createElement('input');
    inp.type = 'text'; inp.placeholder = 'Upiši odgovor...'; inp.id = 'openInput';
    const btn = document.createElement('button');
    btn.className = 'submit-btn'; btn.textContent = 'Provjeri';

    if(saved) {
      inp.value = saved.chosen; inp.disabled = true; btn.disabled = true;
      inp.classList.add(saved.correct ? 'correct' : 'wrong');
      showFeedback(feedback, saved.correct, q.a);
    } else {
      inp.onkeydown = e => { if(e.key==='Enter') checkOpen(q, inp, btn, feedback); };
      btn.onclick = () => checkOpen(q, inp, btn, feedback);
      setTimeout(()=>inp.focus(), 100);
    }
    wrap.appendChild(inp); wrap.appendChild(btn); body.appendChild(wrap);
  } else {
    const div = document.createElement('div');
    div.className = 'options';
    ['A','B','C','D'].forEach((letter, i) => {
      const btn = document.createElement('button');
      btn.className = 'option';
      btn.innerHTML = `<span class="option-letter">${letter}</span><span>${q.o[i]}</span>`;
      if(saved) {
        btn.classList.add('disabled');
        if(i === q.a) btn.classList.add('correct');
        if(i === saved.chosen && i !== q.a) btn.classList.add('wrong');
      } else {
        btn.onclick = () => checkMC(i, q, feedback);
      }
      div.appendChild(btn);
    });
    body.appendChild(div);
    if(saved) showFeedback(feedback, saved.correct, q.open ? q.a : q.o[q.a]);
  }
}

function showFeedback(el, correct, correctAnswer) {
  if(correct) {
    el.className = 'feedback ok show'; el.textContent = '✓ Točno!';
  } else {
    el.className = 'feedback bad show'; el.textContent = `✗ Netočno. Točan odgovor: ${correctAnswer}`;
  }
}

function checkMC(chosen, q, feedback) {
  if(history[current]) return;
  document.querySelectorAll('.option').forEach((o,i) => {
    o.classList.add('disabled'); o.onclick = null;
    if(i === q.a) o.classList.add('correct');
    if(i === chosen && i !== q.a) o.classList.add('wrong');
  });
  const correct = chosen === q.a;
  if(correct) score++;
  history[current] = { chosen, correct };
  document.getElementById('scoreText').textContent = score;
  showFeedback(feedback, correct, q.o[q.a]);
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.textContent = current === questions.length-1 ? 'Završi kviz →' : 'Sljedeće pitanje →';
  nextBtn.classList.add('show');
}

function checkOpen(q, inp, btn, feedback) {
  if(history[current]) return;
  const val = inp.value.trim();
  if(!val) return;
  inp.disabled = true; btn.disabled = true;
  const correct = val.toLowerCase() === q.a.toLowerCase();
  if(correct) score++;
  inp.classList.add(correct ? 'correct' : 'wrong');
  history[current] = { chosen: val, correct };
  document.getElementById('scoreText').textContent = score;
  showFeedback(feedback, correct, q.a);
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.textContent = current === questions.length-1 ? 'Završi kviz →' : 'Sljedeće pitanje →';
  nextBtn.classList.add('show');
}

function nextQuestion() {
  current++;
  if(current >= questions.length) { showResults(); return; }
  renderQuestion(); window.scrollTo(0,0);
}

function prevQuestion() {
  if(current > 0) { current--; renderQuestion(); window.scrollTo(0,0); }
}

function showResults() {
  document.getElementById('questionCard').style.display = 'none';
  document.getElementById('nextBtn').classList.remove('show');
  document.getElementById('prevBtn').classList.remove('show');
  document.getElementById('progressFill').style.width = '100%';
  const pct = Math.round((score/questions.length)*100);
  document.getElementById('finalScore').textContent = `${score}/${questions.length}`;
  const msg = pct>=90 ? '🏆 Odlično! Spreman/na za kolokvij!' :
               pct>=70 ? '👍 Dobro! Još malo ponavljanja i bit će savršeno.' :
               pct>=50 ? '📚 Polovica! Prolazi još jednom kroz gradivo.' :
                         '💪 Vježba čini majstora. Ponovi i probaj opet!';
  document.getElementById('finalMsg').textContent = msg;
  document.getElementById('results').classList.add('show');
  window.scrollTo(0,0);
}

let reviewVisible = false;
function toggleReview() {
  reviewVisible = !reviewVisible;
  const sec = document.getElementById('reviewSection');
  const btn = document.getElementById('reviewToggleBtn');
  if(reviewVisible) {
    buildReview();
    sec.classList.add('show');
    btn.textContent = 'Sakrij pregled';
  } else {
    sec.classList.remove('show');
    btn.textContent = 'Pregledaj odgovore';
  }
}

function buildReview() {
  const list = document.getElementById('reviewList');
  list.innerHTML = '';
  const letters = ['A','B','C','D'];
  questions.forEach((q, i) => {
    const h = history[i];
    const ok = h && h.correct;
    const item = document.createElement('div');
    item.className = `review-item ${ok ? 'ok' : 'bad'}`;

    const status = document.createElement('div');
    status.className = `review-status ${ok ? 'ok' : 'bad'}`;
    status.textContent = ok ? `✓  PITANJE ${i+1} — Točno` : `✗  PITANJE ${i+1} — Netočno`;
    item.appendChild(status);

    const qEl = document.createElement('div');
    qEl.className = 'review-q';
    qEl.innerHTML = qTextHtml(q.t);
    item.appendChild(qEl);

    const ans = document.createElement('div');
    ans.className = 'review-answers';

    const correctEl = document.createElement('div');
    correctEl.className = 'review-correct-ans';
    correctEl.textContent = q.open ? `✓ Točan odgovor: ${q.a}` : `✓ Točan odgovor: ${letters[q.a]}. ${q.o[q.a]}`;
    ans.appendChild(correctEl);

    if(h && !h.correct) {
      const wrongEl = document.createElement('div');
      wrongEl.className = 'review-wrong-ans';
      wrongEl.textContent = q.open
        ? `✗ Tvoj odgovor: ${h.chosen}`
        : `✗ Tvoj odgovor: ${letters[h.chosen]}. ${q.o[h.chosen]}`;
      ans.appendChild(wrongEl);
    }
    item.appendChild(ans);
    list.appendChild(item);
  });
}

function restart() {
  reviewVisible = false;
  init(); window.scrollTo(0,0);
}

init();
</script>
